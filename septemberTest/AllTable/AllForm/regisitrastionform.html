<!DOCTYPE html>
<html>
    <head>
        <title>Resitration Form</title>
    </head>
    <body>
        <form>

            <h1>Resitration Form</h1>

            <label>Full Name :</label>
            <input type="text">
            <br><br>

             <label>Email :</label>
            <input type="email">
            <br><br>

             <label>Password:</label>
            <input type="password">
            <br><br>

             <label>Age :</label>
            <input type="number">
            <br><br>


             <label>Gender :</label>

            <input type="radio" name="gender" value="male">
            <label>Male</label>
            

            <input type="radio" name="gender" value="female">
            <label>Female</label>

             <input type="radio" name="gender" value="other">
            <label>Other</label>
            <br><br>

            <label>skills :</label>

            <input type="checkbox" name="skill" value="html">
            <label>HTML</label>

            <input type="checkbox" name="skill" value="css">
            <label>CSS</label>

            <input type="checkbox" name="skill" value="javescript">
            <label>Javascript</label>
            <br><br>

            <label>city :</label>

            <select>

                <option>--Select Option--</option>
                <option>Hisar</option>
                <option>delhi</option>
                <option>Rohtak</option>
                <option>Gurugram</option>

            </select>
            <br><br>

            <label>Address :</label>
            <br>
            <textarea rows="5" cols="30"></textarea>
            <br><br>


            <button type="submit">
             register
            </button>

            

        </form>
    </body>
</html>
