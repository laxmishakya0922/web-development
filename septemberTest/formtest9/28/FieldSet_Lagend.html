<!DOCTYPE html>
<html>

<head>
    <title>New Doucment</title>
</head>

<body>

    <form>
        <fieldset>
            <legend>Student Information</legend>

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <br><br>

            <label for="class">Class</label>
            <input type="number" id="class" placeholder="Enter your class" required>
            <br><br>

            <label for="rollno.">Rollno.</label>
            <input type="number" id="rollno." placeholder="Enter your rollno." required>
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Parent Details</legend>

            <label for="father name">Father Name</label>
            <input type="text " id="father name" name="father name" placeholder="Enter your father name" required>
            <br><br>

            <label for="mother name">Mother Name</label>
            <input type="text" id="mother name" name="mother name" placeholder="Enter your mother name" required>
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number">

            <br><br>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter email">

        </fieldset>


        <fieldset>
            <legend>Address Information</legend>

            <label for="address">Full Address</label>

            <textarea id="address" name="address" rows="4" cols="30"></textarea>

            <br><br>
        </fieldset>
            <fieldset>
                <legend>Student Skills</legend>

                <label>skills :</label>

                <input type="checkbox" name="skill" value="html">
                <label>HTML</label>

                <input type="checkbox" name="skill" value="css">
                <label>CSS</label>

                <input type="checkbox" name="skill" value="javescript">
                <label>Javascript</label>
                <br><br>

            </fieldset>

            <fieldset>
                <legend>Gender</legend>

                <label>Gender :</label>

                <input type="radio" name="gender" value="male">
                <label>Male</label>


                <input type="radio" name="gender" value="female">
                <label>Female</label>

                <input type="radio" name="gender" value="other">
                <label>Other</label>
                <br><br>
            </fieldset>


            <fieldset>
                <legend>Student Category</legend>

                <label for="category">Choose Student Category:</label>
                <select name="student_category" id="category" required>
                    <option value="">--Select--</option>
                    <option value="general">General (UR)</option>
                    <option value="obc">OBC</option>
                    <option value="sc">SC</option>
                    <option value="st">ST</option>
                    <option value="ews">EWS</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Student City</legend>

                <label>city :</label>

                <select>

                    <option>--Select Option--</option>
                    <option>Hisar</option>
                    <option>delhi</option>
                    <option>Rohtak</option>
                    <option>Gurugram</option>

                </select>
            </fieldset>

            <fieldset>
                
        <br>

        <button type="submit">Submit Admission</button>
        <button type="reset">Reset Form</button>


            </fieldset>
    </form>
</body>

</html>
