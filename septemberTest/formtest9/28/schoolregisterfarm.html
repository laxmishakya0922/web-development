<!DOCTYPE html>
<html>

<head>
    <title>School student menegment page</title>
</head>

<body>
    <center>
        <form>


            <h1>School student menegment page</h1>

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="enter your name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="enter your name" required>
            <br><br>

            <label for="password">password:</label>
            <input type="password" id="password" placeholder="enter your name" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="age" id="age" placeholder="enter your name" required>
            <br><br>

            <label>gender:</label>
            <input type="radio" name="gender" value="male">
            <label>Male</label>

            <input type="radio" name="gender" value="female">
            <label>female</label>

            <input type="radio" name="gender" value="other">
            <label>Other</label>
            <br><br>

            <label>Subject:</label>
            <input type="checkbox" name="subject" value="english">
            <label>English</label>

            <input type="checkbox" name="subject" value="math">
            <label>Math</label>

            <input type="checkbox" name="subject" value="Science">
            <label>Science</label>
            <br><br>

            <label>Address</label>
            <textarea role="5" cols="30"></textarea>

            <br><br>

            <button>register</button>
            <br><br>



            <table border="1">
                <h1>Student list</h1>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>City</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>10</td>
                    <td>Hisar</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>Aman</td>
                    <td>9</td>
                    <td>Delhi</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>priya</td>
                    <td>10</td>
                    <td>Rohtak</td>
                    <td>Active</td>
                </tr>
            </table>





        </form>
    </center>
</body>

</html>
