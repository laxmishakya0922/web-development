<!DOCTYPE html>
<html>

<head>
    <title>Student information farm</title>
</head>

<body>
    <center>

    <h1>Personal Information</h1>

    <form>
        <label for="name"> Student Name:</label>
        <input type="text" id="name" name="name" placeholder="enter your name" required>
        <br><br>


        <label for=" father_name"> Father Name:</label>
        <input type="text" id="father_name" name="father_name" placeholder="enter father name" required>
        <br><br>


        <label for=" mother_name"> Mother Name:</label>
        <input type="text" id="mother_name " name="mother_name" placeholder="enter mother name" required>
        <br><br>


        <label for="date of birth">Date of birth:</label>
        <input type="date" id="date of birth" placeholder="enter date of birth" required>
        <br><br>


        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="enter your age" required>
        <br><br>

        <h1>Contact Information</h1>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="enter your email" required>
        <br><br>

        <label for="phoneNo">PhoneNo.:</label>
        <input type="number" id="phoneNo" name="phoneNo" placeholder="enter your phone number" required>
        <br><br>


        <label>Address:</label>
        <textarea rows="5" cols="30"></textarea>
        <bt><br>

            <h1>Academic Information</h1>
            <label for="class">Class:</label>
            <input type="class" id="class">
            <br><br>

            <label>Previous school:</label>
            <input type="previous school" id="previous school">
            <br><br>

            <h1>Gender</h1>
            <label>Gender:</label>
            <input type="radio"  id="male"  name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other" required>
            <label for="other">Other</label>
            <br><br>

            <label>Subject:</label>
            <input type="checkbox" id="english" name="subject" value="english">
            <label for="english">English</label>

            <input type="checkbox" id="hindi" name="subject" value="hindi">
            <label for="hindi">Hindi</label>

            <input type="checkbox" id="math" name="subject" value="math">
            <label for="math">Math</label>

            <input type="checkbox" id="science" name="subject" value="science">
            <label for="science">Science</label>

            <input type="checkbox" id="computer" name="subject" value="computer">
            <label for="computer">Computer</label>
            <br><br>

            <h1>City</h1>
            <label for="city">city</label>

            <select id="city">
                <option>--select city--</option>
                <option>Hisar</option>
                <option>Delhi</option>
                <option>Rohtak</option>
                <option>Gurgram</option>
            </select>
            <br><br>


            <button>
                submit addmission farm
            </button>

    </form>
    </center>
</body>

</html>
